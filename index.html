<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sounding</title>
    <meta
      name="description"
      content="A short puzzle game about seeing a place by what it sends back."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1 class="sr-only">Sounding</h1>
    <nav class="sr-only" aria-label="Primary"><a href="./">Sounding</a></nav>

  <div id="stage" data-channel="r">
    <canvas id="ink"></canvas>
    <canvas id="notes"></canvas>

    <div id="counter" aria-live="polite"></div>
    <div id="budget" hidden>
      <div id="clicks" aria-live="polite"></div>
      <button id="restart" type="button" hidden>restart</button>
    </div>

    <div class="controls">
      <div class="swatches" id="swatches"></div>
      <div class="tools">
        <button class="tool" id="pen" type="button" aria-label="Pen" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>
          </svg>
        </button>
        <button class="tool" id="erase" type="button" aria-label="Erase notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20h16"/><path d="M14.5 4.5 20 10 11 19H6l-2.5-2.5z"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="win" hidden><span>YOU WIN</span></div>
    <div id="wipe" aria-hidden="true"></div>

    <div class="answer">
      <div id="slots"></div>
      <input id="entry" type="text" inputmode="text" autocomplete="off"
             autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Code">
    </div>
  </div>

    <script type="module" src="./src/game.js"></script>
  </body>
</html>
